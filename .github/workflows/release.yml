name: Release

# Runs on every push to main. When package.json contains a version that has
# no GitHub Release yet, it tags the commit, creates a Release from the
# matching CHANGELOG.md section and (if the NPM_TOKEN secret is set)
# publishes the package to npm with provenance. Safe to re-run: each step
# is skipped when its work is already done.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm test

      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V already exists, skipping."
            exit 0
          fi
          awk -v v="$V" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No CHANGELOG.md section for $V"
            exit 1
          fi
          gh release create "v$V" --target "$GITHUB_SHA" --title "v$V" --notes-file notes.md

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          V: ${{ steps.v.outputs.version }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN secret not set, skipping npm publish."
            exit 0
          fi
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$V" version >/dev/null 2>&1; then
            echo "$NAME@$V is already on npm, skipping."
            exit 0
          fi
          npm publish --provenance --access public
